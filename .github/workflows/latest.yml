name: Build and Publish Latest

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-latest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test and Package
        run: mvn --batch-mode --no-transfer-progress clean package
      - name: Verify and Stage Shaded JAR
        shell: bash
        run: |
          set -euo pipefail
          name=$(mvn --quiet --batch-mode --no-transfer-progress help:evaluate -Dexpression=project.build.finalName -DforceStdout -Dstyle.color=never)
          version=$(mvn --quiet --batch-mode --no-transfer-progress help:evaluate -Dexpression=project.version -DforceStdout -Dstyle.color=never)
          printf 'PLUGIN_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          artifact="target/${name}.jar"
          contents=$(jar tf "$artifact")
          for required in plugin.yml velocity-plugin.json net/kyori/adventure/platform/bukkit/BukkitAudiences.class; do
            grep -Fxq "$required" <<< "$contents"
          done
          for provided in org/bukkit/Bukkit.class com/velocitypowered/api/proxy/ProxyServer.class; do
            if grep -Fxq "$provided" <<< "$contents"; then
              printf 'Server API must remain provided: %s\n' "$provided" >&2
              exit 1
            fi
          done
          mkdir -p release
          cp "$artifact" "release/vestri-dynamic-servers-${version}.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: vestri-dynamic-servers
          path: release/*.jar
          if-no-files-found: error
      - name: Publish Fixed Latest Release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const {owner, repo} = context.repo;
            const version = process.env.PLUGIN_VERSION;
            if (!version) throw new Error('Missing Maven plugin version');
            const sha = require('child_process').execFileSync('git', ['rev-parse', 'HEAD'], {encoding: 'utf8'}).trim();
            const branch = await github.rest.repos.getBranch({owner, repo, branch: 'main'});
            if (branch.data.commit.sha !== sha) {
              core.notice('main advanced during the build; leaving latest unchanged.');
              return;
            }
            const files = fs.readdirSync('release').filter(name => name.endsWith('.jar'));
            if (files.length !== 1) throw new Error('Expected exactly one verified shaded JAR');
            const name = files[0];
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({owner, repo, tag: 'latest'})).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({owner, repo, tag_name: 'latest',
                target_commitish: sha, name: version, draft: true, prerelease: false})).data;
            }
            const assets = await github.paginate(github.rest.repos.listReleaseAssets,
              {owner, repo, release_id: release.id, per_page: 100});
            const data = fs.readFileSync(`release/${name}`);
            const existing = assets.find(asset => asset.name === name);
            const digest = 'sha256:' + require('crypto').createHash('sha256').update(data).digest('hex');
            const needsUpload = !existing || existing.digest !== digest;
            if (existing && needsUpload) {
              await github.rest.repos.deleteReleaseAsset({owner, repo, asset_id: existing.id});
            }
            if (needsUpload) {
              await github.rest.repos.uploadReleaseAsset({owner, repo, release_id: release.id,
                name, data, headers: {'content-type': 'application/java-archive', 'content-length': data.length}});
            }
            try {
              await github.rest.git.getRef({owner, repo, ref: 'tags/latest'});
              await github.rest.git.updateRef({owner, repo, ref: 'tags/latest', sha, force: true});
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({owner, repo, ref: 'refs/tags/latest', sha});
            }
            await github.rest.repos.updateRelease({owner, repo, release_id: release.id,
              name: version, body: `Latest tested main build: ${sha}\n\nJava 17; one JAR for Paper/Spigot and Velocity.`,
              draft: false, prerelease: false, make_latest: 'true'});
            for (const asset of assets) {
              if (asset.name.endsWith('.jar') && asset.name !== name) {
                await github.rest.repos.deleteReleaseAsset({owner, repo, asset_id: asset.id});
              }
            }
